<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura Conversacional</title>
    <style>
        :root {
            --bg-color: #0c0d12;
            --panel-bg: #14161f;
            --border-color: #2a2e3d;
            --text-color: #d1d5db;
            --accent-green: #10b981;
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --font-family: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .header {
            background-color: #1a1d29;
            padding: 12px 20px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.2rem;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            .main-layout {
                display: grid;
                grid-template-columns: 2fr 1fr;
            }
        }

        .terminal-panel {
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-bottom: 2px solid var(--border-color);
        }

        @media (min-width: 768px) {
            .terminal-panel {
                border-bottom: none;
                border-right: 2px solid var(--border-color);
            }
        }

        .log-area {
            height: 380px;
            overflow-y: auto;
            background-color: #08090c;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .log-entry {
            margin-bottom: 12px;
            white-space: pre-wrap;
        }

        .log-entry.system {
            color: #888;
        }

        .log-entry.player {
            color: var(--accent-blue);
            font-weight: bold;
        }

        .log-entry.npc {
            color: var(--accent-gold);
        }

        .log-entry.room-title {
            color: var(--accent-green);
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 1px dashed var(--accent-green);
            padding-bottom: 4px;
            margin-top: 10px;
        }

        .input-form {
            display: flex;
            gap: 10px;
        }

        .input-form input {
            flex: 1;
            background-color: #08090c;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 15px;
            font-family: inherit;
            border-radius: 4px;
            outline: none;
        }

        .input-form input:focus {
            border-color: var(--accent-green);
        }

        .input-form button {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-family: inherit;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .input-form button:hover {
            opacity: 0.9;
        }

        .sidebar {
            padding: 20px;
            background-color: #11131a;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-block {
            background-color: #171922;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
        }

        .panel-block h3 {
            font-size: 0.9rem;
            color: var(--accent-green);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .inventory-list {
            list-style: none;
            font-size: 0.85rem;
        }

        .inventory-list li {
            padding: 4px 0;
            border-bottom: 1px solid #222533;
        }

        .inventory-list li:last-child {
            border-bottom: none;
        }

        .help-text {
            font-size: 0.8rem;
            color: #888;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Aventura Conversacional</h1>
        <span style="font-size: 0.8rem; color: #666;">Sin IA - 100% Privado</span>
    </div>

    <div class="main-layout">
        <div class="terminal-panel">
            <div class="log-area" id="logArea"></div>
            <form class="input-form" id="inputForm">
                <input type="text" id="userInput" placeholder="Escribe un comando o habla..." autocomplete="off" autofocus>
                <button type="submit">Enviar</button>
            </form>
        </div>

        <div class="sidebar">
            <div class="panel-block">
                <h3>Inventario</h3>
                <ul class="inventory-list" id="inventoryList">
                    <li>(Vacío)</li>
                </ul>
            </div>

            <div class="panel-block">
                <h3>Comandos Útiles</h3>
                <div class="help-text">
                    - <b>ir [norte/sur/este/oeste]</b>: Moverte.<br>
                    - <b>coger [objeto]</b>: Recoger objeto.<br>
                    - <b>decir [mensaje]</b> o escribe libremente para hablar con el personaje.
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ==========================================
// 1. BASE DE DATOS DEL JUEGO (NARRATIVA)
// ==========================================

const HABITACIONES = {
    "entrada": {
        nombre: "Entrada del Templo",
        descripcion: "Te encuentras ante la imponente entrada de un antiguo templo de piedra. La humedad llena el aire.",
        salidas: { norte: "vestibulo" },
        objetos: ["salvoconducto"],
        personaje: null
    },
    "vestibulo": {
        nombre: "Gran Vestíbulo",
        descripcion: "Una amplia sala abovedada iluminada por antorchas en las paredes.",
        salidas: { sur: "entrada", este: "biblioteca" },
        objetos: [],
        personaje: "guardia"
    },
    "biblioteca": {
        nombre: "Biblioteca Olvidada",
        descripcion: "Estanterías repletas de tomos antiguos y polvorientos.",
        salidas: { oeste: "vestibulo" },
        objetos: ["libro_antiguo"],
        personaje: null
    }
};

const PERSONAJES = {
    "guardia": {
        nombre: "Guardia del Templo",
        saludo: "Un guardia con armadura pesada cruza los brazos y te observa fijamente al entrar.",
        dialogos: [
            {
                keywords: ["hola", "saludos", "buenas", "quien"],
                response: "El guardia murmura: 'Soy el custodio de este templo. Mantén las manos donde pueda verlas.'"
            },
            {
                keywords: ["llave", "puerta", "pasar", "entrar", "abrir"],
                response: "El guardia niega con la cabeza: 'La puerta interior está cerrada. Necesitas mostrarme un salvoconducto para pasar.'"
            },
            {
                keywords: ["salvoconducto", "permiso", "papel", "pase"],
                response: "El guardia examina el documento detenidamente: 'Todo parece estar en regla. Toma la llave de bronce.'",
                itemRequired: "salvoconducto",
                itemGiven: "llave_bronce"
            }
        ],
        respuestaDefecto: "El guardia te mira en silencio y no responde a tus palabras."
    }
};

const DESCRIPCION_OBJETOS = {
    "salvoconducto": "Un documento oficial sellado con cera roja.",
    "libro_antiguo": "Un tomo encuadernado en cuero gastado.",
    "llave_bronce": "Una llave pesada de bronce con adornos."
};

// ==========================================
// 2. ESTADO DEL JUEGO
// ==========================================

let estado = {
    habitacionActual: "entrada",
    inventario: []
};

// ==========================================
// 3. FUNCIONES DE INTERFAZ (UI)
// ==========================================

const logArea = document.getElementById("logArea");
const userInput = document.getElementById("userInput");
const inputForm = document.getElementById("inputForm");
const inventoryList = document.getElementById("inventoryList");

function agregarLog(texto, tipo = "") {
    const entry = document.createElement("div");
    entry.className = `log-entry ${tipo}`;
    entry.innerText = texto;
    logArea.appendChild(entry);
    logArea.scrollTop = logArea.scrollHeight;
}

function actualizarInventarioUI() {
    inventoryList.innerHTML = "";
    if (estado.inventario.length === 0) {
        inventoryList.innerHTML = "<li>(Vacío)</li>";
        return;
    }
    estado.inventario.forEach(obj => {
        const li = document.createElement("li");
        li.innerText = obj;
        inventoryList.appendChild(li);
    });
}

function mostrarHabitacion() {
    const hab = HABITACIONES[estado.habitacionActual];
    agregarLog(`--- ${hab.nombre.toUpperCase()} ---`, "room-title");
    agregarLog(hab.descripcion);

    if (hab.objetos.length > 0) {
        agregarLog(`Objetos en este lugar: ${hab.objetos.join(", ")}`, "system");
    }

    const salidas = Object.keys(hab.salidas).join(", ");
    agregarLog(`Salidas disponibles: ${salidas}`, "system");

    if (hab.personaje && PERSONAJES[hab.personaje]) {
        agregarLog(`
${PERSONAJES[hab.personaje].saludo}`, "npc");
    }
}

// ==========================================
// 4. MOTOR DE PARSER DE TEXTO Y DIÁLOGOS
// ==========================================

function limpiarTexto(texto) {
    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[.,/#!$%^&*;:{}=\-_`~()?"'¡!¿?]/g, "")
        .trim();
}

function procesarComando(entrada) {
    const textoBruto = entrada.trim();
    if (!textoBruto) return;

    agregarLog(`> ${textoBruto}`, "player");

    const textoLimpio = limpiarTexto(textoBruto);
    const partes = textoLimpio.split(" ");
    const comando = partes[0];
    const argumento = partes.slice(1).join(" ");

    const hab = HABITACIONES[estado.habitacionActual];

    // --- 1. COMANDOS DE MOVIMIENTO ---
    if (["ir", "norte", "sur", "este", "oeste"].includes(comando)) {
        let direccion = comando === "ir" ? argumento : comando;
        if (hab.salidas[direccion]) {
            estado.habitacionActual = hab.salidas[direccion];
            mostrarHabitacion();
        } else {
            agregarLog("No puedes ir en esa dirección.", "system");
        }
        return;
    }

    // --- 2. RECOGER OBJETOS ---
    if (["coger", "tomar", "agarrar"].includes(comando)) {
        const index = hab.objetos.indexOf(argumento);
        if (index !== -1) {
            hab.objetos.splice(index, 1);
            estado.inventario.push(argumento);
            actualizarInventarioUI();
            agregarLog(`Has recogido: ${argumento}`, "system");
        } else {
            agregarLog("No ves eso aquí.", "system");
        }
        return;
    }

    // --- 3. DIÁLOGO CON NPC (MOTOR DE PALABRAS CLAVE) ---
    if (hab.personaje && PERSONAJES[hab.personaje]) {
        const npc = PERSONAJES[hab.personaje];
        let fraseAEvaluar = comando === "decir" ? argumento : textoLimpio;
        let respondido = false;

        for (let nodo of npc.dialogos) {
            const coincide = nodo.keywords.some(kw => fraseAEvaluar.includes(limpiarTexto(kw)));
            if (coincide) {
                if (nodo.itemRequired && !estado.inventario.includes(nodo.itemRequired)) {
                    agregarLog(`${npc.nombre}: 'Dices tener lo necesario, pero no me lo has mostrado.'`, "npc");
                    respondido = true;
                    break;
                }

                let msg = `${npc.nombre}: '${nodo.response}'`;

                if (nodo.itemGiven && !estado.inventario.includes(nodo.itemGiven)) {
                    estado.inventario.push(nodo.itemGiven);
                    actualizarInventarioUI();
                    msg += `
[¡Has recibido: ${nodo.itemGiven}!]`;
                }

                agregarLog(msg, "npc");
                respondido = true;
                break;
            }
        }

        if (respondido) return;

        // Si la frase no encajó con ninguna palabra clave y el comando no era del sistema:
        if (comando !== "mirar" && comando !== "ayuda") {
            agregarLog(`${npc.nombre}: '${npc.respuestaDefecto}'`, "npc");
            return;
        }
    }

    // --- 4. AYUDA ---
    if (comando === "ayuda") {
        agregarLog("Comandos: 'ir [direccion]', 'coger [objeto]', o escribe cualquier frase para hablar con los personajes de la sala.", "system");
        return;
    }

    agregarLog("No entiendo ese comando. Escribe 'ayuda' para ver la lista.", "system");
}

// ==========================================
// 5. INICIALIZACIÓN
// ==========================================

inputForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const val = userInput.value;
    userInput.value = "";
    procesarComando(val);
});

// Mensaje de inicio
agregarLog("¡Bienvenido a la Aventura Conversacional!", "system");
mostrarHabitacion();

</script>
</body>
</html>
